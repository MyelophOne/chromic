name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: chromic-release
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version || '0.1.0' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Analyze Conventional Commits
        id: release
        shell: bash
        run: |
          chmod +x .github/workflows/analyzeRelease.sh
          .github/workflows/analyzeRelease.sh "$GITHUB_OUTPUT" release.md

      - name: Upload release notes
        if: steps.release.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release.md
          if-no-files-found: error

  build:
    needs: analyze
    if: needs.analyze.outputs.should_release == 'true'
    runs-on: windows-2025
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7

      - name: Materialize release key
        shell: pwsh
        env:
          CHROMIC_RELEASE_KEY: ${{ secrets.CHROMIC_RELEASE_KEY }}
        run: |
          if ($env:CHROMIC_RELEASE_KEY -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'Repository secret CHROMIC_RELEASE_KEY must contain exactly 64 hexadecimal characters.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'chromic-release.key'
          [IO.File]::WriteAllText($keyPath, $env:CHROMIC_RELEASE_KEY, [Text.Encoding]::ASCII)
          "CHROMIC_RELEASE_KEY_FILE=$keyPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows x64
        shell: pwsh
        run: .\build.ps1 -PortableKeyFile $env:CHROMIC_RELEASE_KEY_FILE

      - name: Write checksums
        shell: pwsh
        run: |
          $dll = (Get-FileHash .\out\version.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $ini = (Get-FileHash .\out\chromic.ini -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$dll  version.dll", "$ini  chromic.ini") |
            Set-Content -LiteralPath .\out\SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chromic-windows-x64
          path: |
            out/version.dll
            out/chromic.ini
            out/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: [analyze, build]
    if: needs.analyze.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-metadata

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: chromic-windows-x64
          path: out

      - name: Attest release files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/version.dll
            out/chromic.ini
            out/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: v${{ needs.analyze.outputs.version }}
          name: v${{ needs.analyze.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release.md
          fail_on_unmatched_files: true
          files: |
            out/version.dll
            out/chromic.ini
            out/SHA256SUMS.txt
